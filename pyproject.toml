[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecb"
version = "0.1.0"
description = "Evidence-Conditioned Continuous Bandit for recommendation workflows"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ecb-train = "ecb.cli:train_main"
ecb-fit-reward = "ecb.cli:reward_main"
ecb-evaluate = "ecb.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
